
name: Build and deploy Beyond the CV

on:
  push:
    branches: [main]
    paths:
      - 'applications/**'
      - 'content/**'
      - 'scripts/**'
      - 'dist/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build personalized pages
        run: python scripts/build.py

      - name: Verify local assets and scripts
        run: |
          python -m compileall -q scripts
          find dist/assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" && test -n "$NETLIFY_SITE_ID"
          npx --yes netlify-cli@23 deploy --dir=dist --prod --no-build --message="Content Studio $GITHUB_SHA"
